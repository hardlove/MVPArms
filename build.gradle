// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: "config.gradle"
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.4.2'
        // Gradle Android Maven plugin, used by JitPack via the install task
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://repo.huaweicloud.com/repository/maven/" }
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Newer JitPack looks for publishToMavenLocal; map it to the existing install tasks.
task publishToMavenLocal {
    dependsOn ':arms:install', ':arms-autolayout:install', ':arms-imageloader-glide:install'
}

// JitCI runs a full `build` including androidTest. Disable those tasks after every
// project is evaluated so AGP-created tasks are included (whenTaskAdded is too early).
gradle.projectsEvaluated {
    allprojects { p ->
        p.tasks.matching { task ->
            def n = task.name
            n.contains('AndroidTest') || n.contains('UnitTest') || n == 'test'
        }.all { task ->
            task.enabled = false
            task.onlyIf { false }
        }
    }
}
