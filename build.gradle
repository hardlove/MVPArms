// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: "config.gradle"
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.4.2'
        // Gradle Android Maven plugin, used by JitPack via the install task
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://repo.huaweicloud.com/repository/maven/" }
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Newer JitPack looks for publishToMavenLocal; map it to the existing install tasks.
task publishToMavenLocal {
    dependsOn ':arms:install', ':arms-autolayout:install', ':arms-imageloader-glide:install'
}

// JitCI runs a full `build` including androidTest. Library modules keep AppCompat as
// compileOnly, so instrumented tests fail on missing AppCompat resources. Publishing
// only needs the AAR, so skip those test tasks.
subprojects { sub ->
    sub.tasks.whenTaskAdded { task ->
        def n = task.name
        if (n.contains('AndroidTest') || n.contains('UnitTest') || n == 'test') {
            task.enabled = false
        }
    }
}
